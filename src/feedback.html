
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Campus Bites</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header class="site-header">
    <div class="container nav-container">
        <a href="index.html" class="logo">Campus <span>Bites</span></a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="deals.html">Deals</a>
            <a href="order.html">Order</a>
            <a href="feedback.html" class="active">Feedback</a>
        </nav>
    </div>
</header>

<section class="feedback-hero">
    <div class="container">
        <h1>We Value Your Feedback</h1>
        <p>Your opinion helps us serve you better. Tell us about your experience!</p>
    </div>
</section>

<main class="feedback-section">
    <div class="container">
        <div class="feedback-card">
            <h2>Share Your Experience</h2>
            <p>We would love to hear from you.</p>

            <form action="#" method="post" class="feedback-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="rating">Rate Your Experience</label>
                    <select id="rating" name="rating" required>
                        <option value="">Select a rating</option>
                        <option value="5">Excellent - 5 Stars</option>
                        <option value="4">Very Good - 4 Stars</option>
                        <option value="3">Good - 3 Stars</option>
                        <option value="2">Fair - 2 Stars</option>
                        <option value="1">Poor - 1 Star</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Feedback Category</label>
                    <select id="category" name="category" required>
                        <option value="">Choose a category</option>
                        <option value="food">Food Quality</option>
                        <option value="service">Customer Service</option>
                        <option value="delivery">Order Experience</option>
                        <option value="website">Website Experience</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Write your feedback here..."
                              required></textarea>
                </div>

                <button type="submit" class="feedback-btn">
                    Submit Feedback
                </button>
            </form>
        </div>
    </div>
</main>

<footer class="site-footer">
    <p>&copy; 2026 Campus Bites. All Rights Reserved.</p>
</footer>

</body>
</html>
